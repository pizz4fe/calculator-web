<!DOCTYPE html>
<html>
<head>
    <title>Python Calculator</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.1.1/core.css">

    <script type="module"
          src="https://pyscript.net/releases/2024.1.1/core.js">
    </script>
</head>

<body>
    <h1>Python Calculator</h1>

    <input id="num1" type="number">

    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <input id="num2" type="number">

    <button py-click="calculate">Calculate</button>

    <h2 id="result"></h2>

    <script type="py">
        from pyscript import document

        def calculate(event):
            try:
                a = float(document.querySelector("#num1").value)
                b = float(document.querySelector("#num2").value)
                op = document.querySelector("#operation").value

                if op == "+":
                    result = a + b
                elif op == "-":
                    result = a - b
                elif op == "*":
                    result = a * b
                elif op == "/":
                    result = a / b

            except ZeroDivisionError:
                result = "Cannot divide by zero"

            except ValueError:
                result = "Enter valid numbers"

            document.querySelector("#result").innerText = str(result)
    </script>
</body>
</html>
