<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #eee8f5;
            text-align: center;
            padding-top: 100px;
        }

        .calculator {
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #ccc;
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            background: #9678d3;
            color: white;
            cursor: pointer;
        }

        h2 {
            color: #7655b5;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h1>Calculator</h1>

        <form method="POST">

            <input type="number" name="num1"
                   placeholder="First number"
                   step="any" required>

            <select name="operation">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (×)</option>
                <option value="/">Division (÷)</option>
            </select>

            <input type="number" name="num2"
                   placeholder="Second number"
                   step="any" required>

            <button type="submit">Calculate</button>

        </form>

        <h2>Result: {{ result }}</h2>
    </div>

</body>
</html>
